name: fix-entity-schema
on:
  push:
    branches: [fix-entity-schema]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify Person schema
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          P = 'https://philpegram.com/#phil-pegram'
          M = 'https://philpegram.com/#mosaic-cic'
          pat = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S)
          pages = ['index', 'about', 'work', 'speaking', 'writing', 'contact', 'evidence-capacity', 'military-transition']
          bad = ['Q1636895', 'Q1892824', 'Q4383857']

          def read(n):
              return pathlib.Path(n + '.html').read_text(encoding='utf-8')

          def graph_of(t):
              return json.loads(pat.search(t).group(2))

          about = graph_of(read('about'))
          person = next(n for n in about['@graph'] if n.get('@id') == P)
          mosaic = next(n for n in about['@graph'] if n.get('@id') == M)
          person['url'] = 'https://philpegram.com/about'
          slim = {'@type': 'Person', '@id': P, 'name': 'Phil Pegram', 'url': 'https://philpegram.com/about'}

          for n in pages:
              t = read(n)
              data = graph_of(t)
              g = data['@graph']
              hits = [i for i, x in enumerate(g) if x.get('@id') == P]
              assert len(hits) == 1, (n, hits)
              if n in ('index', 'about'):
                  node = json.loads(json.dumps(person))
                  if n == 'index':
                      node.pop('mainEntityOfPage', None)
                      if not any(x.get('@id') == M for x in g):
                          g.append(json.loads(json.dumps(mosaic)))
                  g[hits[0]] = node
              else:
                  g[hits[0]] = dict(slim)
              out = json.dumps(data, indent=2, ensure_ascii=False)
              t2 = pat.sub(lambda m: m.group(1) + '\n' + out + '\n' + m.group(3), t, count=1)
              for b in bad:
                  assert b not in t2, (n, b)
              graph_of(t2)
              pathlib.Path(n + '.html').write_text(t2, encoding='utf-8')
              print(n, 'ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unify Person schema and fix Wikidata IDs"
          git push
