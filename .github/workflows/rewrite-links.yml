name: rewrite-links
on:
  push:
    branches: [clean-internal-links]
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite links
        run: |
          for f in index about work speaking writing contact evidence-capacity military-transition; do
            sed -i -E \
              -e 's#href="index\.html"#href="/"#g' \
              -e 's#href="(work|about|speaking|writing|contact|evidence-capacity|military-transition)\.html#href="/\1#g' \
              -e 's#href="(work|about|speaking|writing|contact)"#href="/\1"#g' \
              "$f.html"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Use clean internal URLs to match canonicals and sitemap"
          git push
